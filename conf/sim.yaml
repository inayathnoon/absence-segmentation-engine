# ---------------------------------------------------------------------------
# Simulator configuration. Every number this repository reports is a function
# of this file: the generator plants the effects declared here, and the
# pipeline's job is to recover them. Nothing here describes any real estate,
# organisation or cost base.
# ---------------------------------------------------------------------------

seed: 61803

profile: demo

profiles:
  # Acceptance target: a 28-day slice that runs end to end in under 3 minutes.
  demo:
    n_employees: 6_000
    n_days: 28
    n_cities: 8
    n_workplaces: 14
    end_date: "2025-06-29"

  # The size the brief describes.
  full:
    n_employees: 95_000
    n_days: 180
    n_cities: 30
    n_workplaces: 110
    end_date: "2025-06-29"

