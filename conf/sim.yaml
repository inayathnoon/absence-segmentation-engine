# ---------------------------------------------------------------------------
# Organisation.
# ---------------------------------------------------------------------------
org:
  departments_l1: ["Engineering", "Product", "Commercial", "Operations", "Corporate"]
  l2_per_l1: { min: 2, max: 3 }
  l3_per_l2: { min: 2, max: 4 }
  l4_per_l3: { min: 2, max: 5 }
  team_size: { mean: 42, sigma: 0.7, min: 4 }
  # A team is seated across this many floors of its home workplace.
  floors_per_team: { min: 1, max: 3 }

  employee_type_mix: { FTE: 0.80, intern: 0.05, contractor: 0.10, BPO: 0.05 }
  tenure_days: { mean: 780, sigma: 1.0, max: 5_000 }
  joiner_share: 0.030      # hired inside the window
  leaver_share: 0.035      # left inside the window

# ---------------------------------------------------------------------------
# PLANTED GROUND TRUTH.
#
# Two kinds of plant, at two different grains, because the taxonomy has two
# grains (see docs/decisions/0001-two-grains.md):
#
#   * employee-day causes  -> the P1-P8 and O1-O4 labels
#   * allocation excess    -> the O5-O7 labels and the recoverable capacity
# ---------------------------------------------------------------------------
planted:
  scheduled_days_per_week:
    Engineering: 3
    Product: 3
    Commercial: 4
    Operations: 5
    Corporate: 4
  weekday_weights: [0.78, 1.18, 1.28, 1.12, 0.64]

  # Attendance propensity on a day the employee is expected in.
  attendance_rate_by_region: { AMER: 0.64, EMEA: 0.60, APAC: 0.72 }
  propensity_concentration: 11.0
  off_schedule_attendance_rate: 0.05

  # --- Planned / non-actionable causes ---
  public_holiday_days_per_country: 3
  leave:
    daily_hazard: 0.016
    duration_days: { mean: 2.6, sigma: 0.9, max: 20 }
    type_mix: { annual: 0.54, sick: 0.23, parental: 0.06, unpaid: 0.05, comp: 0.12 }
    status_mix: { approved: 0.89, pending: 0.06, cancelled: 0.05 }
  travel:
    trip_hazard: 0.0040
    duration_days: { min: 1, max: 9 }
    cancelled_share: 0.06
  assignment_share: 0.022          # posted to another city for a period
  shift_offset_share: 0.018        # works a non-standard weekday pattern

  # --- Optimizable / actionable causes ---
  # O2: a cohort with a chronic no-show pattern, over and above ordinary
  # day-to-day variation. These are the people the O2 rule should surface.
  chronic_no_show_share: 0.040
  chronic_no_show_attendance_rate: 0.22

  # O3: a share of attended days that are token visits.
  partial_day_share: 0.075
  partial_day_hours: { mean: 1.5, sigma: 0.45, max: 2.4 }

  # O4: desk bookings that are never used.
  booking_rate_free_sharing: 0.55  # of free-sharing attendees who book ahead
  booking_no_show_share: 0.18      # of bookings never tapped against

  # --- Allocation excess: the recoverable capacity, planted directly ---
  #
  # Each allocation unit is sized at its own P90 demand plus a buffer, then a
  # planted excess is added on top. The pipeline has to recover that excess
  # from attendance evidence alone.
  allocation_excess:
    # Share of units carrying each kind of excess, and how large it is
    # relative to the unit's sized requirement.
    o5_allocation_exceeds_schedule: { share: 0.22, magnitude: { mean: 0.30, sigma: 0.10 } }
    o6_structural_oversupply:       { share: 0.18, magnitude: { mean: 0.22, sigma: 0.08 } }
    o7_stale_allocation:            { share: 0.12, magnitude: { mean: 0.26, sigma: 0.09 } }
    # Units that are correctly sized, or under-sized.
    under_sized_share: 0.10
    under_sized_magnitude: { mean: 0.12, sigma: 0.05 }

# ---------------------------------------------------------------------------
# Capacity and savings model.
# ---------------------------------------------------------------------------
capacity:
  # Size to the 90th percentile of weekly demand, never the mean. See the
  # README: sizing to the mean fails on every peak day by construction.
  demand_percentile: 0.90
  buffer: 0.10
  # Policy dial: what share of the O1 (no-show) and O4 (booked-not-used)
  # opportunity is treated as genuinely recoverable. Behaviour does not change
  # for free, so this is deliberately well below 1.0 and is a policy input,
  # not a measurement.
  o1_recoverable_fraction: 0.35
  o4_recoverable_fraction: 0.50
  # Minimum weeks of evidence before a unit may be resized.
  min_weeks_evidence: 2
  # Sensitivity sweep for the heatmap.
  sensitivity:
    percentiles: [0.75, 0.80, 0.85, 0.90, 0.95, 0.99]
    buffers: [0.00, 0.05, 0.10, 0.15, 0.20]

# ---------------------------------------------------------------------------
# Taxonomy thresholds. Every rule that needs a number takes it from here, so
# the rule cascade in dbt contains no buried constants.
# ---------------------------------------------------------------------------
taxonomy:
  partial_day_hours_threshold: 2.5
  unreported_absence_window_days: 10
  unreported_absence_min_no_shows: 3
  headcount_decline_threshold: 0.10

# ---------------------------------------------------------------------------
# Data quality thresholds.
# ---------------------------------------------------------------------------
dq:
  freshness_sla_hours: { badge_taps: 50, hr_roster: 26, leave_requests: 26, desk_bookings: 26 }
  reconciliation_tolerance: 0.005
  min_label_coverage: 1.0     # every employee-day must carry exactly one label
